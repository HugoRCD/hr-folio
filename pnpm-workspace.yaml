allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  '@swc/core': false
  better-sqlite3: true
  sharp: true
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  cbor-extract: false
  prisma: true
  puppeteer: false

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  - '@vercel/*'
  - '@shelve/cli'
  - '@iconify-json/simple-icons'
  - '@unhead/bundler'
  - nuxtseo-shared
  - site-config-stack
  - unhead
  - evlog
  - satori
  - '@comark/*'
  - comark
  - comark-content
